version: '3.8'
services:
  mongodb-staging:
    image: mongo:4.4
    volumes:
      - mongodb_staging_data:/data/db
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - staging_net

  auth-service:
    image: 192.168.102.114:5000/auth-service:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
    environment:
      NODE_ENV: staging
      MONGODB_URI: mongodb://mongodb-staging:27017/auth
      JWT_SECRET: staging_jwt_secret_change_me
    networks:
      - staging_net

  product-service:
    image: 192.168.102.114:5000/product-service:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
    environment:
      NODE_ENV: staging
      MONGODB_URI: mongodb://mongodb-staging:27017/products
    networks:
      - staging_net

  order-service:
    image: 192.168.102.114:5000/order-service:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
    environment:
      NODE_ENV: staging
      MONGODB_URI: mongodb://mongodb-staging:27017/orders
      JWT_SECRET: staging_jwt_secret_change_me
      PRODUCT_SERVICE_URL: http://product-service:3000
    networks:
      - staging_net

  frontend:
    image: 192.168.102.114:5000/frontend:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend-staging.rule=Host(`staging.app.local`)"
        - "traefik.http.routers.frontend-staging.entrypoints=websecure"
        - "traefik.http.routers.frontend-staging.tls=true"
        - "traefik.http.services.frontend-staging.loadbalancer.server.port=8080"
    environment:
      NODE_ENV: staging
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3000
      ORDER_SERVICE_URL: http://order-service:3002
    networks:
      - staging_net

volumes:
  mongodb_staging_data:
    driver: local

networks:
  staging_net:
    driver: overlay
